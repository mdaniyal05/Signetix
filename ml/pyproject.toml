[project]
name = "ml"
version = "0.1.0"
description = "A machine learning module for video processing and hand gesture analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "av>=9.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "mediapipe>=0.10.35",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.13.0.92",
    "pydantic>=1.10.15",
    "requests>=2.3.1",
    "tensorflow>=2.21.0",
    "uvicorn>=0.48.0",
    "videosdk>=0.3.3",
    "websockets>=15.0.1",
]
